name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies, so nothing to install. The matcher test exercises
      # cross-language retrieval against the real book; the AI test stubs the
      # network and covers the code we wrote around the model.
      - name: Test matcher, AI layer and data files
        run: npm test