#:schema node_modules/wrangler/config-schema.json
name = "zhou-dream-ai"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Edge rate limit: at most 3 readings per minute per client, enforced by
# Cloudflare before KV is involved (stops parallel bursts). namespace_id is any
# number unique within the account.
[[ratelimits]]
name = "AI_RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

# Hourly budget (10 per IP) as a KV sliding window. Best-effort: if KV fails
# (e.g. the free plan's daily write quota) requests are allowed and the edge
# limit above still applies.
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "7e75bc02a26d4a2d9491e412d2331def"

# Secrets are NOT configured here. Set them with:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put RATE_SALT
#
# RATE_SALT is any random string; it salts the IP hash so the KV store holds a
# digest rather than a raw address. Generate one with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

[observability]
enabled = true
